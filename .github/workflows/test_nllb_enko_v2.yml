name: Test NLLB en-ko quality v2

on:
  push:
    branches:
      - automation/mil461h-ko-v2-test
    paths:
      - 'scripts/test_nllb_enko_v2.py'
      - '.github/workflows/test_nllb_enko_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2==4.8.1' 'transformers==4.53.3' sentencepiece huggingface_hub
      - name: Run translation samples
        run: python scripts/test_nllb_enko_v2.py
      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: nllb-enko-v2-sample
          path: nllb_sample_output.txt
          if-no-files-found: error
          retention-days: 2
