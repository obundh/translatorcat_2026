name: Build MIL-STD-461H Korean full translation (fast Argos)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/mil461h_full_ko_argos.py'
      - '.github/workflows/mil461h_full_ko_argos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonts and PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: Cache Argos English-Korean model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-ko-v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'argostranslate==1.10.0' 'pymupdf==1.26.7' pillow numpy

      - name: Download and verify MIL-STD-461H source PDF
        run: |
          mkdir -p work output
          curl --retry 5 --retry-delay 5 -fL \
            'https://ib-lenhardt.com/media/pages/product-testing/mil-std-461-standard/5f60c140af-1778507796/mil-std-461h-ibl-lab.pdf' \
            -o work/MIL_STD_461H_2026_EN.pdf
          python - <<'PY'
          import fitz
          d=fitz.open('work/MIL_STD_461H_2026_EN.pdf')
          assert d.page_count == 294, d.page_count
          print('Source verified:', d.page_count, 'pages')
          PY

      - name: Translate, rebuild, and compare all 294 pages
        run: |
          python scripts/mil461h_full_ko_argos.py \
            --source work/MIL_STD_461H_2026_EN.pdf \
            --outdir output

      - name: Package deliverables
        run: |
          cp work/MIL_STD_461H_2026_EN.pdf output/MIL_STD_461H_2026_EN_ORIGINAL.pdf
          cd output
          zip -9 MIL_STD_461H_2026_KO_FULL_PACKAGE.zip \
            MIL_STD_461H_2026_KO_FULL.pdf \
            MIL_STD_461H_2026_EN_ORIGINAL.pdf \
            MIL_STD_461H_2026_KO_QA.json \
            MIL_STD_461H_2026_KO_REGRESSION.json \
            MIL_STD_461H_2026_KO_COMPARISON.png \
            README_KO.txt SHA256SUMS.txt
          ls -lh

      - name: Upload verified translation artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIL_STD_461H_2026_KO_FULL_ARGOS
          path: |
            output/MIL_STD_461H_2026_KO_FULL.pdf
            output/MIL_STD_461H_2026_KO_FULL_PACKAGE.zip
            output/MIL_STD_461H_2026_KO_QA.json
            output/MIL_STD_461H_2026_KO_REGRESSION.json
            output/MIL_STD_461H_2026_KO_COMPARISON.png
            output/README_KO.txt
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
