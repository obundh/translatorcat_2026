name: MIL-STD-461H Korean revision 2 sample review run

on:
  push:
    branches:
      - automation/milstd461h-ko-revision2-20260821
    paths:
      - 'scripts/mil461h_revision2.py'
      - '.github/workflows/mil461h_revision2_sample_run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-noto-cjk poppler-utils
      - name: Install CPU translation and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers==4.53.3' sentencepiece sacremoses safetensors protobuf 'ctranslate2==4.6.0' 'pymupdf==1.26.7' pillow numpy
      - name: Download and convert specialized EN-KO model
        run: |
          mkdir -p work/model output
          ct2-transformers-converter \
            --model NHNDQ/nllb-finetuned-en2ko \
            --output_dir work/model \
            --quantization int8 \
            --force
      - name: Download MIL-STD-461H source
        run: |
          curl --retry 5 --retry-delay 5 -fL \
            'https://ib-lenhardt.com/media/pages/product-testing/mil-std-461-standard/5f60c140af-1778507796/mil-std-461h-ibl-lab.pdf' \
            -o work/MIL_STD_461H_2026_EN.pdf
          python - <<'PY'
          import fitz
          d=fitz.open('work/MIL_STD_461H_2026_EN.pdf')
          assert d.page_count == 294, d.page_count
          print('Source verified:', d.page_count)
          PY
      - name: Compose representative pages and compare
        run: |
          python scripts/mil461h_revision2.py \
            --source work/MIL_STD_461H_2026_EN.pdf \
            --model-dir work/model \
            --outdir output \
            --pages '1,3,11,21,23,29,40,84,107,118,119,165,166,167,292,293,294'
          ls -lh output
      - name: Upload review sample
        uses: actions/upload-artifact@v4
        with:
          name: MIL_STD_461H_KO_REVISION2_SAMPLE_RUN
          path: output/*
          if-no-files-found: error
          retention-days: 3
