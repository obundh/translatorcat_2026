name: Test Korean translation models v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test_translation_models_v2.py'
      - '.github/workflows/test_translation_models_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.57,<5' sentencepiece safetensors accelerate protobuf
      - name: Compare models
        run: python scripts/test_translation_models_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: translation-models-v2
          path: translation_models_v2.json
          if-no-files-found: error
          retention-days: 2
