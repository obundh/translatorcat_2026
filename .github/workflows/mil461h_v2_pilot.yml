name: Build MIL-STD-461H Korean revision 2 pilot

on:
  push:
    branches:
      - automation/milstd461h-ko-revision2
    paths:
      - '.github/milstd461h/milstd461h_v2.py.gz.b64'
      - 'scripts/milstd461h_v2_revision.py'
      - 'scripts/milstd461h_v2_final.py'
      - 'scripts/milstd461h_v2_reviewed.py'
      - '.github/workflows/mil461h_v2_pilot.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/milstd461h/milstd461h_v2.py.gz.b64'
      - 'scripts/milstd461h_v2_revision.py'
      - 'scripts/milstd461h_v2_final.py'
      - 'scripts/milstd461h_v2_reviewed.py'
      - '.github/workflows/mil461h_v2_pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          python -m pip install --upgrade pip
          python -m pip install 'pymupdf==1.26.7' pillow numpy ctranslate2 'transformers==5.15.1' sentencepiece huggingface_hub
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-enko-test-v1
      - name: Decode revision engine
        run: |
          mkdir -p scripts work output
          base64 -d .github/milstd461h/milstd461h_v2.py.gz.b64 | gzip -d > scripts/milstd461h_v2.py
          python -m py_compile scripts/milstd461h_v2.py scripts/milstd461h_v2_revision.py scripts/milstd461h_v2_final.py scripts/milstd461h_v2_reviewed.py
      - name: Download and verify source
        run: |
          curl --retry 5 --retry-delay 5 -fL \
            'https://ib-lenhardt.com/media/pages/product-testing/mil-std-461-standard/5f60c140af-1778507796/mil-std-461h-ibl-lab.pdf' \
            -o work/MIL_STD_461H_2026_EN.pdf
          python - <<'PY'
          import fitz
          d=fitz.open('work/MIL_STD_461H_2026_EN.pdf')
          assert d.page_count == 294, d.page_count
          print('Source verified:', d.page_count)
          PY
      - name: Build representative pilot pages
        run: |
          python scripts/milstd461h_v2_reviewed.py \
            --source work/MIL_STD_461H_2026_EN.pdf \
            --outdir output \
            --pages '1-4,20-22,158-161,292-294'
      - name: Package pilot
        run: |
          cd output
          zip -9 MIL_STD_461H_2026_KO_V2_PILOT_PACKAGE.zip \
            MIL_STD_461H_2026_KO_PILOT.pdf \
            MIL_STD_461H_2026_KO_PILOT_QA.json \
            MIL_STD_461H_2026_KO_PILOT_REGRESSION.json \
            MIL_STD_461H_2026_KO_PILOT_COMPARISON.png \
            translation_cache_nllb_v2.json SHA256SUMS.txt
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: MIL_STD_461H_2026_KO_V2_PILOT
          path: output/*
          if-no-files-found: error
          retention-days: 7
