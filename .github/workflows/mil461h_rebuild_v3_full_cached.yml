name: MIL-STD-461H Korean rebuild v3 cached full final

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/mil461h/v3_src/**'
      - '.github/workflows/mil461h_rebuild_v3_full_cached.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Korean fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils zip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pymupdf==1.26.7' requests pillow numpy
      - name: Assemble rebuild engine
        run: |
          mkdir -p scripts work output comparison
          cat .github/mil461h/v3_src/src_*.part > scripts/mil461h_rebuild_v3.py
          python -m py_compile scripts/mil461h_rebuild_v3.py
          sha256sum scripts/mil461h_rebuild_v3.py
      - name: Download and verify source
        run: |
          curl --retry 5 --retry-delay 5 -fL \
            'https://ib-lenhardt.com/media/pages/product-testing/mil-std-461-standard/5f60c140af-1778507796/mil-std-461h-ibl-lab.pdf' \
            -o work/MIL_STD_461H_2026_EN.pdf
          python - <<'PY'
          import fitz
          d=fitz.open('work/MIL_STD_461H_2026_EN.pdf')
          assert d.page_count == 294 and not d.is_encrypted
          print('Source verified:', d.page_count)
          PY
      - name: Restore previous complete translation cache
        uses: actions/cache@v4
        with:
          path: work/google_translation_cache.json
          key: mil461h-google-ko-v3-final-${{ hashFiles('.github/mil461h/v3_src/**') }}
          restore-keys: |
            mil461h-google-ko-v3-
      - name: Build all 294 pages
        run: |
          python scripts/mil461h_rebuild_v3.py \
            --source work/MIL_STD_461H_2026_EN.pdf \
            --output output/MIL461H_KO_FINAL_294P.pdf \
            --cache work/google_translation_cache.json \
            --qa output/MIL461H_KO_FINAL_QA.json \
            --validation output/MIL461H_KO_FINAL_VALIDATION.json \
            --workers 6
          cp work/google_translation_cache.json output/google_translation_cache.json
      - name: Verify structure, text and opening
        run: |
          python - <<'PY'
          import fitz, json, pathlib, hashlib, re
          out=pathlib.Path('output')
          pdf=out/'MIL461H_KO_FINAL_294P.pdf'
          qa=json.loads((out/'MIL461H_KO_FINAL_QA.json').read_text(encoding='utf-8'))
          val=json.loads((out/'MIL461H_KO_FINAL_VALIDATION.json').read_text(encoding='utf-8'))
          d=fitz.open(pdf)
          all_text='\n'.join(p.get_text() for p in d)
          prohibited=['스코프','지상 비행체','신청.','방사선 감수성','방사 민감성','하위 시스템','서브시스템','전원 리드','라인-투-그라운드','접지 평면']
          result={
            'file':str(pdf),
            'bytes':pdf.stat().st_size,
            'pages':d.page_count,
            'encrypted':bool(d.is_encrypted),
            'geometry_mismatch_pages':val.get('geometry_mismatch_pages',[]),
            'image_count_mismatch_pages':val.get('image_count_mismatch_pages',[]),
            'prohibited_terms':[x for x in prohibited if x in all_text],
            'body_overflow_count':qa.get('body_overflow_count'),
            'table_overflow_count':qa.get('table_overflow_count'),
            'toc_overflow_count':qa.get('toc_overflow_count'),
            'sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
          }
          result['structural_pass']=bool(result['pages']==294 and not result['encrypted'] and not result['geometry_mismatch_pages'] and not result['image_count_mismatch_pages'] and not result['prohibited_terms'])
          (out/'MIL461H_KO_FINAL_GATE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert result['structural_pass']
          PY
      - name: Render representative pages for visual review
        run: |
          mkdir -p comparison
          python - <<'PY'
          import fitz
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          src=fitz.open('work/MIL_STD_461H_2026_EN.pdf')
          out=fitz.open('output/MIL461H_KO_FINAL_294P.pdf')
          pages=[1,3,5,15,21,23,47,82,147,158,165,172,181,203,217,231,234,236,281,293,294]
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',16)
          panels=[]
          for pno in pages:
              a=src[pno-1].get_pixmap(matrix=fitz.Matrix(0.9,0.9),alpha=False)
              b=out[pno-1].get_pixmap(matrix=fitz.Matrix(0.9,0.9),alpha=False)
              ia=Image.frombytes('RGB',(a.width,a.height),a.samples)
              ib=Image.frombytes('RGB',(b.width,b.height),b.samples)
              panels.append((pno,ia,ib))
              ib.save(f'output/MIL461H_KO_FINAL_PAGE_{pno:03d}.jpg',quality=92)
          w=max(max(a.width,b.width) for _,a,b in panels)
          row_h=max(max(a.height,b.height) for _,a,b in panels)+26
          sheet=Image.new('RGB',(w*2,row_h*len(panels)),'white')
          draw=ImageDraw.Draw(sheet)
          y=0
          for pno,a,b in panels:
              draw.text((5,y+4),f'ORIGINAL p{pno}',font=font,fill='black')
              draw.text((w+5,y+4),f'KOREAN p{pno}',font=font,fill='black')
              sheet.paste(a,(0,y+26)); sheet.paste(b,(w,y+26)); y+=row_h
          sheet.save('output/MIL461H_KO_FINAL_COMPARISON.jpg',quality=92)
          PY
      - name: Create split PDFs, manifest and package
        run: |
          cp work/MIL_STD_461H_2026_EN.pdf output/MIL461H_EN_ORIGINAL_294P.pdf
          python - <<'PY'
          import fitz, pathlib, hashlib, json
          out=pathlib.Path('output')
          pdf=out/'MIL461H_KO_FINAL_294P.pdf'
          d=fitz.open(pdf)
          manifest={'file':pdf.name,'bytes':pdf.stat().st_size,'pages':d.page_count,'encrypted':bool(d.is_encrypted),'sha256':hashlib.sha256(pdf.read_bytes()).hexdigest()}
          for first,last in [(1,100),(101,200),(201,294)]:
              part=fitz.open(); part.insert_pdf(d,from_page=first-1,to_page=last-1)
              path=out/f'MIL461H_KO_FINAL_P{first:03d}_{last:03d}.pdf'
              part.save(path,garbage=4,deflate=True); part.close()
              check=fitz.open(path)
              manifest[path.name]={'bytes':path.stat().st_size,'pages':check.page_count,'encrypted':bool(check.is_encrypted),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
              check.close()
          d.close()
          (out/'MIL461H_KO_FINAL_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd output
          sha256sum MIL461H_KO_FINAL_294P.pdf MIL461H_KO_FINAL_P001_100.pdf MIL461H_KO_FINAL_P101_200.pdf MIL461H_KO_FINAL_P201_294.pdf > SHA256SUMS.txt
          zip -9 MIL461H_KO_FINAL_PACKAGE.zip \
            MIL461H_KO_FINAL_294P.pdf \
            MIL461H_KO_FINAL_P001_100.pdf \
            MIL461H_KO_FINAL_P101_200.pdf \
            MIL461H_KO_FINAL_P201_294.pdf \
            MIL461H_EN_ORIGINAL_294P.pdf \
            MIL461H_KO_FINAL_QA.json \
            MIL461H_KO_FINAL_VALIDATION.json \
            MIL461H_KO_FINAL_GATE.json \
            MIL461H_KO_FINAL_MANIFEST.json \
            MIL461H_KO_FINAL_COMPARISON.jpg \
            SHA256SUMS.txt
          unzip -t MIL461H_KO_FINAL_PACKAGE.zip
          ls -lh
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIL461H_KO_FINAL_294P_CACHED
          path: output/*
          if-no-files-found: error
          retention-days: 7
