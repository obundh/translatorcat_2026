name: Test Google translation quality for MIL-STD-461H

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mil461h_google_translate_test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Translate samples
        run: |
          python - <<'PY'
          import json, requests, time
          samples = [
            'SCOPE',
            'Application.',
            'Ground plane.',
            'Other test sites.',
            'The use of line-to-ground filters for EMI control shall be minimized.',
            'Such filters establish low impedance paths for structure (common mode) currents through the ground plane and can be a major cause of interference in systems, platforms, or installations.',
            'The operational performance of an equipment or subsystem shall not be degraded, nor shall it malfunction, when all of the units or devices in the equipment or subsystem are operating together at their designed levels of efficiency or their design capability.',
            'CE101, conducted emissions, audio frequency currents, power leads.',
            'Input (primary) power leads, returns, and wire grounds.',
            'RS105, radiated susceptibility, transient electromagnetic field.',
            'Electronic, electrical, and electromechanical equipment and subsystems shall comply with the applicable general interface requirements in 4.2.',
            'The EUT shall be installed on a ground plane that simulates the actual installation.',
          ]
          session = requests.Session()
          session.headers['User-Agent'] = 'Mozilla/5.0'
          out=[]
          for text in samples:
            r=session.get('https://translate.googleapis.com/translate_a/single', params={'client':'gtx','sl':'en','tl':'ko','dt':'t','q':text}, timeout=30)
            r.raise_for_status()
            data=r.json()
            trans=''.join(x[0] for x in data[0] if x and x[0])
            out.append({'source':text,'translation':trans})
            print(text,'=>',trans,flush=True)
            time.sleep(0.2)
          open('google_translation_samples.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: google-translation-samples
          path: google_translation_samples.json
          retention-days: 2
