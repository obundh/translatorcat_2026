name: Build MIL-STD-461H Korean revision 2 full document

on:
  push:
    branches:
      - automation/milstd461h-ko-revision2
    paths:
      - '.github/milstd461h/milstd461h_v2.py.gz.b64'
      - 'scripts/milstd461h_v2_revision.py'
      - 'scripts/milstd461h_v2_final.py'
      - 'scripts/milstd461h_v2_reviewed.py'
      - '.github/workflows/mil461h_v2_full.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/milstd461h/milstd461h_v2.py.gz.b64'
      - 'scripts/milstd461h_v2_revision.py'
      - 'scripts/milstd461h_v2_final.py'
      - 'scripts/milstd461h_v2_reviewed.py'
      - '.github/workflows/mil461h_v2_full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/milstd461h-ko-revision2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils zip
          python -m pip install --upgrade pip
          python -m pip install 'pymupdf==1.26.7' pillow numpy ctranslate2 'transformers==5.15.1' sentencepiece huggingface_hub
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-enko-test-v1
      - name: Decode revision engine
        run: |
          mkdir -p scripts work output
          base64 -d .github/milstd461h/milstd461h_v2.py.gz.b64 | gzip -d > scripts/milstd461h_v2.py
          python -m py_compile scripts/milstd461h_v2.py scripts/milstd461h_v2_revision.py scripts/milstd461h_v2_final.py scripts/milstd461h_v2_reviewed.py
      - name: Download and verify source
        run: |
          curl --retry 5 --retry-delay 5 -fL \
            'https://ib-lenhardt.com/media/pages/product-testing/mil-std-461-standard/5f60c140af-1778507796/mil-std-461h-ibl-lab.pdf' \
            -o work/MIL_STD_461H_2026_EN.pdf
          python - <<'PY'
          import fitz
          d=fitz.open('work/MIL_STD_461H_2026_EN.pdf')
          assert d.page_count == 294, d.page_count
          print('Source verified:', d.page_count)
          PY
      - name: Build complete 294-page Korean translation
        run: |
          python scripts/milstd461h_v2_reviewed.py \
            --source work/MIL_STD_461H_2026_EN.pdf \
            --outdir output
      - name: Verify output and package
        run: |
          cp work/MIL_STD_461H_2026_EN.pdf output/MIL_STD_461H_2026_EN_ORIGINAL.pdf
          python - <<'PY'
          import fitz, json, pathlib
          p=pathlib.Path('output/MIL_STD_461H_2026_KO_FULL.pdf')
          d=fitz.open(p)
          assert d.page_count == 294, d.page_count
          for number in (1,2,3,4,20,21,22,158,159,160,161,292,293,294):
              pix=d[number-1].get_pixmap(dpi=100, alpha=False)
              assert pix.width > 0 and pix.height > 0
          qa=json.loads(pathlib.Path('output/MIL_STD_461H_2026_KO_FULL_QA.json').read_text(encoding='utf-8'))
          assert not qa.get('placeholder_pages'), qa.get('placeholder_pages')
          assert qa.get('fit_failures', 9999) <= 5, qa.get('fit_failures')
          print('Output verified:', d.page_count, 'pages; fit failures=', qa.get('fit_failures'))
          PY
          cd output
          sha256sum MIL_STD_461H_2026_KO_FULL.pdf > SHA256SUMS.txt
          zip -9 MIL_STD_461H_2026_KO_FULL_REVISED_PACKAGE.zip \
            MIL_STD_461H_2026_KO_FULL.pdf \
            MIL_STD_461H_2026_EN_ORIGINAL.pdf \
            MIL_STD_461H_2026_KO_FULL_QA.json \
            MIL_STD_461H_2026_KO_FULL_REGRESSION.json \
            MIL_STD_461H_2026_KO_FULL_COMPARISON.png \
            translation_cache_nllb_v2.json SHA256SUMS.txt
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: MIL_STD_461H_2026_KO_FULL_REVISED
          path: |
            output/MIL_STD_461H_2026_KO_FULL.pdf
            output/MIL_STD_461H_2026_KO_FULL_REVISED_PACKAGE.zip
            output/MIL_STD_461H_2026_KO_FULL_QA.json
            output/MIL_STD_461H_2026_KO_FULL_REGRESSION.json
            output/MIL_STD_461H_2026_KO_FULL_COMPARISON.png
            output/translation_cache_nllb_v2.json
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
