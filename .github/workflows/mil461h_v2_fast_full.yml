name: Build MIL-STD-461H Korean revision 2 fast full

on:
  push:
    branches:
      - automation/milstd461h-ko-revision2
    paths:
      - 'scripts/milstd461h_v2_fast.py'
      - '.github/workflows/mil461h_v2_fast_full.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/milstd461h_v2_fast.py'
      - '.github/workflows/mil461h_v2_fast_full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/milstd461h-ko-revision2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils zip
          python -m pip install --upgrade pip
          python -m pip install 'pymupdf==1.26.7' pillow numpy ctranslate2 'transformers==5.15.1' sentencepiece huggingface_hub
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-enko-test-v1
      - name: Decode base engine
        run: |
          mkdir -p scripts work output
          base64 -d .github/milstd461h/milstd461h_v2.py.gz.b64 | gzip -d > scripts/milstd461h_v2.py
          python -m py_compile scripts/milstd461h_v2.py scripts/milstd461h_v2_revision.py scripts/milstd461h_v2_final.py scripts/milstd461h_v2_reviewed.py scripts/milstd461h_v2_fast.py
      - name: Download source
        run: |
          curl --retry 5 --retry-delay 5 -fL \
            'https://ib-lenhardt.com/media/pages/product-testing/mil-std-461-standard/5f60c140af-1778507796/mil-std-461h-ibl-lab.pdf' \
            -o work/MIL_STD_461H_2026_EN.pdf
      - name: Build fast complete document
        run: |
          python scripts/milstd461h_v2_fast.py \
            --source work/MIL_STD_461H_2026_EN.pdf \
            --outdir output
      - name: Verify and package
        run: |
          cp work/MIL_STD_461H_2026_EN.pdf output/MIL_STD_461H_2026_EN_ORIGINAL.pdf
          python - <<'PY'
          import fitz,json,pathlib
          d=fitz.open('output/MIL_STD_461H_2026_KO_FULL.pdf')
          assert d.page_count==294,d.page_count
          qa=json.loads(pathlib.Path('output/MIL_STD_461H_2026_KO_FULL_QA.json').read_text(encoding='utf-8'))
          assert not qa.get('placeholder_pages'),qa.get('placeholder_pages')
          print('verified',d.page_count,'fit_failures',qa.get('fit_failures'))
          PY
          cd output
          sha256sum MIL_STD_461H_2026_KO_FULL.pdf > SHA256SUMS.txt
          zip -9 MIL_STD_461H_2026_KO_FAST_FULL_PACKAGE.zip \
            MIL_STD_461H_2026_KO_FULL.pdf MIL_STD_461H_2026_EN_ORIGINAL.pdf \
            MIL_STD_461H_2026_KO_FULL_QA.json MIL_STD_461H_2026_KO_FULL_REGRESSION.json \
            MIL_STD_461H_2026_KO_FULL_COMPARISON.png translation_cache_nllb_v2.json SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MIL_STD_461H_2026_KO_FAST_FULL
          path: output/*
          if-no-files-found: error
          retention-days: 7
